<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>מפת השותפים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&display=swap">
<style>
/* Layout: שלט הכוונה של קניון. פס עליון קבוע עם חיפוש, מתחתיו רשימת מתחמים; כניסה למתחם פותחת לוח לוגואים */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6781; --line:#DCE1EB;
  --brand:#0B6E6E; --brand-ink:#FFFFFF; --signal:#FFC83D; --signal-ink:#3A2A00; --tile:#FFFFFF; --tile-ink:#14213D; --ok:#1B7F4B; --warn:#B45309; --bad:#B42318;
  --display:"Secular One","Heebo","Arial Hebrew",Arial,sans-serif; --text:"Heebo","Arial Hebrew",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#18233A; --ink:#EEF2FA; --muted:#9FADC8; --line:#2A3855;
  --brand:#3FC1BD; --brand-ink:#06201F; --signal:#FFC83D; --signal-ink:#3A2A00; --tile:#F6F8FC; --tile-ink:#14213D; --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#18233A; --ink:#EEF2FA; --muted:#9FADC8; --line:#2A3855;
  --brand:#3FC1BD; --brand-ink:#06201F; --signal:#FFC83D; --signal-ink:#3A2A00; --tile:#F6F8FC; --tile-ink:#14213D; --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo-word{font-family:var(--display);font-size:1.5rem;line-height:1.1;color:var(--ink);text-decoration:none}
.logo-word span{background:var(--signal);color:var(--signal-ink);padding:0 .3em;border-radius:6px}
.org{color:var(--muted);font-size:.85rem}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:12px 44px 12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.search svg{position:absolute;right:14px;top:50%;translate:0 -50%;width:20px;height:20px;stroke:var(--muted);fill:none}
main.wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
.lede{font-size:1.02rem;color:var(--muted);max-width:60ch;margin:0}
.lede b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count-line{font-size:.9rem;color:var(--muted);margin:0}
.malls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;list-style:none;margin:0;padding:0}
.mall{display:flex;flex-direction:column;gap:10px;height:100%;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;transition:border-color .15s,translate .15s}
.mall:hover{border-color:var(--brand);translate:0 -2px}
.mall-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mall-name{font-family:var(--display);font-size:1.15rem;line-height:1.25;margin:0;text-wrap:balance;min-width:0}
.mall-city{color:var(--muted);font-size:.88rem}
.badge{flex:none;min-width:2.4em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--signal);color:var(--signal-ink);border-radius:10px;padding:2px 8px;font-size:1rem}
.strip{display:flex;gap:6px;margin-top:auto;align-items:center}
.mini{flex:1 1 0;min-width:0;height:40px;background:var(--tile);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:5px;overflow:hidden}
.mini img{max-width:100%;max-height:100%;object-fit:contain}
.mini.txt{font-size:.62rem;font-weight:700;color:var(--tile-ink);text-align:center;line-height:1.1}
.more-n{flex:none;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-inline:4px}
.btn{align-self:center;font:inherit;font-weight:500;padding:10px 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
/* דף מתחם */
.back{align-self:flex-start;color:var(--brand);text-decoration:none;font-weight:500}
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.1;margin:0;text-wrap:balance}
.hero .where{opacity:.75;margin:0 0 4px}
.hero .big{display:flex;align-items:baseline;gap:8px;background:var(--signal);color:var(--signal-ink);border-radius:14px;padding:6px 14px}
.hero .big b{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,150px),1fr));gap:10px;list-style:none;margin:0;padding:0}
.tile{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);height:100%}
.tile .art{background:var(--tile);height:92px;display:flex;align-items:center;justify-content:center;padding:14px}
.tile .art img{max-width:100%;max-height:100%;object-fit:contain}
.tile .art.txt{font-family:var(--display);font-size:1.15rem;line-height:1.15;color:var(--tile-ink);text-align:center;text-wrap:balance}
.tile .cap{padding:8px 10px;font-size:.88rem;text-align:center;line-height:1.3}
h2{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:10px 0 0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.9rem}
.links a b{font-variant-numeric:tabular-nums;color:var(--brand)}
.note{font-size:.82rem;color:var(--muted);margin:0;max-width:65ch}
/* תיעוד ביקורים (לנציגים בלבד) */
.who{font-size:.85rem;font-weight:500;color:var(--brand)}
.vis{display:flex;flex-direction:column;gap:6px;padding:0 10px 10px;margin-top:auto;font-size:.8rem;text-align:center}
.vstat{font-weight:700}.vstat.s0{color:var(--ok)}.vstat.s1{color:var(--warn)}.vstat.s2{color:var(--bad)}
.vwhen{color:var(--muted)}
.vdone{display:block;background:var(--ok);color:var(--surface);font-weight:700;font-size:.8rem;text-align:center;padding:3px 6px}
.tile.done .art{opacity:.45}
.tile.done .vbtn{border-color:var(--line);color:var(--muted)}
.mall-prog{font-size:.82rem;color:var(--brand);font-weight:500}
.vlock{color:var(--muted);font-weight:500;padding:6px 4px;border-radius:10px;border:1.5px dashed var(--line)}
.own{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ink);color:var(--bg);margin-top:4px}
.own.me{background:var(--signal);color:var(--signal-ink)}
.own.ok{background:var(--ok);color:var(--surface)}
.claim{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line)}
.claim.me{border-color:var(--signal)}
.claim p{margin:0;min-width:0;flex:1 1 220px}.claim small{display:block;color:var(--muted)}
.claim button{font:inherit;font-weight:700;padding:10px 16px;border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.claim button.no{background:transparent;color:var(--ink)}
.claim button:disabled{opacity:.55;cursor:default}
.dwarn{margin:0;padding:10px 12px;border-radius:12px;background:var(--bg);border:1.5px solid var(--warn);font-size:.9rem}
.vbtn{font:inherit;font-size:.85rem;font-weight:500;padding:7px 8px;border-radius:10px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer}
.vbtn:hover{background:var(--brand);color:var(--brand-ink)}
.progress{font-size:.9rem;color:var(--muted);margin:0}
dialog{border:none;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(8,14,28,.6)}
.dform{display:flex;flex-direction:column;gap:14px;padding:20px}
.dform h2{margin:0;font-size:1.3rem}.dform .sub{margin:0;color:var(--muted);font-size:.9rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts label{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;font-weight:500;font-size:.92rem}
.opts input{position:absolute;opacity:0}
.opts input:checked+span{font-weight:700}
.opts label:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opts label:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.dform textarea{font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:70px}
.kfield{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.kstep{display:flex;align-items:center;gap:8px}
.kstep button{font:inherit;font-size:1.3rem;font-weight:700;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.kstep input{font:inherit;font-size:1.15rem;font-weight:700;width:64px;height:44px;text-align:center;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.photo{display:flex;align-items:center;gap:12px}
.photo label{flex:1;text-align:center;padding:12px;border-radius:12px;border:1.5px dashed var(--brand);color:var(--brand);font-weight:500;cursor:pointer}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.drow{display:flex;gap:10px}
.drow button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1.5px solid var(--ink);cursor:pointer}
.drow .go{background:var(--ink);color:var(--bg)}.drow .no{background:transparent;color:var(--ink)}
.drow button:disabled{opacity:.55;cursor:default}
.derr{margin:0;color:var(--bad);font-size:.9rem}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:20}
@media (prefers-reduced-motion:reduce){.mall{transition:none}}
</style>

</head>
<body>
<div dir="rtl" lang="he">
  <header class="top"><div class="wrap">
    <div class="brandrow">
      <a class="logo-word" href="#">מפת <span>השותפים</span></a>
      <span class="org">הרשתות השותפות של יד לילד המיוחד</span>
      <span class="who" id="who" hidden></span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="חיפוש קניון, עיר או רשת" autocomplete="off" aria-label="חיפוש קניון, עיר או רשת">
    </label>
  </div></header>
  <main class="wrap" id="app"></main>
  <dialog id="dlg" aria-labelledby="dlg-t">
    <form class="dform" id="vform">
      <div><h2 id="dlg-t">תיעוד ביקור</h2><p class="sub" id="dlg-sub"></p></div>
      <div class="opts" role="radiogroup" aria-label="מצב הסניף">
        <label><input type="radio" name="status" id="st0" value="תקין" checked><span>תקין</span></label>
        <label><input type="radio" name="status" id="st1" value="יש בעיה"><span>יש בעיה</span></label>
        <label><input type="radio" name="status" id="st2" value="סניף סגור"><span>סניף סגור</span></label>
      </div>
      <p class="dwarn" id="vwarn" hidden></p>
      <div class="kfield"><label for="vcash">מספר קופאיות</label>
        <div class="kstep"><button type="button" id="kminus" aria-label="פחות קופאית אחת">−</button><input id="vcash" type="number" inputmode="numeric" min="0" max="200" placeholder="?"><button type="button" id="kplus" aria-label="עוד קופאית אחת">+</button></div></div>
      <textarea id="vnote" placeholder="הערה (לא חובה)" maxlength="1000" aria-label="הערה"></textarea>
      <div class="photo"><label for="vphoto" id="vphoto-l">צילום או העלאת תמונה</label><input type="file" id="vphoto" accept="image/*" capture="environment"><img id="vprev" alt="תצוגה מקדימה של התמונה" hidden></div>
      <p class="derr" id="verr" hidden></p>
      <div class="drow"><button type="submit" class="go" id="vsend">שמירת הביקור</button><button type="button" class="no" id="vcancel">ביטול</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

    rep = me.name; $('who').textContent = 'שלום, ' + rep; $('who').hidden = false;
    render();
    await loadVisits(true);
  } catch (e) { /* בלי רשת האתר ממשיך לעבוד לצפייה בלבד */ }
}
/* ביקורים של כל הנציגים: נטענים בכניסה, בכל מעבר בין דפים ובחזרה לאתר, כדי שלא יבקרו פעמיים באותו סניף */
let lastLoad = 0;
async function loadVisits(force) {
  if (!rep || $('dlg').open || (!force && Date.now() - lastLoad < 15000)) return;
  lastLoad = Date.now();
  try {
    const v = await (await fetch(API + '?action=visits&r=' + encodeURIComponent(token))).json();
    if (!v.ok || $('dlg').open) return;
    const sig = JSON.stringify([v.latest.map(x => [x.m, x.c, x.t]).sort(), (v.claims || []).map(c => [c.m, c.by]).sort(), (v.done || []).map(c => [c.m, c.t]).sort(), v.block]);
    if (sig === loadVisits.sig) return;
    loadVisits.sig = sig; applyState(v);
    const y = scrollY, m = byId[location.hash.slice(1)];
    if (m) mallView(m, true); else home();
    scrollTo(0, y);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadVisits(); });
setInterval(() => { if (!document.hidden) loadVisits(); }, 60000);
function shrink(file, max, q) {
  return new Promise((ok, no) => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', q));
    };
    im.onerror = () => no(new Error('image')); im.src = url;
  });
}
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; setTimeout(() => el.hidden = true, 2600); }
$('vphoto').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    photo = await shrink(f, 1280, .75); thumb = await shrink(f, 160, .6);
    $('vprev').src = thumb; $('vprev').hidden = false; $('vphoto-l').textContent = 'החלפת התמונה';
  } catch (err) { photo = thumb = ''; $('verr').textContent = 'לא הצלחנו לקרוא את התמונה. נסו לצלם שוב.'; $('verr').hidden = false; }
});
$('vcancel').addEventListener('click', () => $('dlg').close());
const bump = d => { const i = $('vcash'); i.value = Math.max(0, Math.min(200, (parseInt(i.value, 10) || 0) + d)); };
$('kminus').addEventListener('click', () => bump(-1)); $('kplus').addEventListener('click', () => bump(1));
$('vform').addEventListener('submit', async e => {
  e.preventDefault();
  if (!cur) return;
  const status = new FormData(e.target).get('status'), cashiers = $('vcash').value.trim();
  if (cashiers === '' && status !== 'סניף סגור') { $('verr').textContent = 'כמה קופאיות יש בסניף? צריך למלא מספר לפני השמירה.'; $('verr').hidden = false; $('vcash').focus(); return; }
  const btn = $('vsend'); btn.disabled = true; btn.textContent = 'שומר...'; $('verr').hidden = true;
  try {
    const body = { r: token, m: cur.m.i, mn: cur.m.n, city: cur.m.c, chain: cur.chain, status, cashiers, note: $('vnote').value, photo, thumb };
    const res = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })).json();
    if (!res.ok) { loadVisits.sig = ''; lastLoad = 0; throw new Error(res.error || ''); }
    if (res.latest) { applyState(res); loadVisits.sig = ''; } else latest[cur.m.i + '|' + cur.chain] = res.visit;
    $('dlg').close(); mallView(cur.m, true);
    toast(res.finished ? 'סיימת את ' + cur.m.n + '. אפשר לבחור את המתחם הבא' : 'הביקור ב' + cur.chain + ' נשמר');
  } catch (err) {
    $('verr').textContent = 'הביקור לא נשמר. ' + (err.message && !/fetch|JSON/i.test(err.message) ? err.message : 'בדקו את החיבור לרשת ונסו שוב.'); $('verr').hidden = false;
  } finally { btn.disabled = false; btn.textContent = 'שמירת הביקור'; }
});
function openVisit(m, i) {
  if (!(claims[m.i] && claims[m.i].mine)) { toast(claims[m.i] ? 'המתחם רשום על שם ' + claims[m.i].by : 'כדי לתעד צריך קודם לקחת את המתחם על שמך'); return; }
  cur = { m, chain: D.chains[i].n }; photo = thumb = '';
  $('vform').reset(); $('vprev').hidden = true; $('verr').hidden = true; $('vphoto-l').textContent = 'צילום או העלאת תמונה';
  $('dlg-sub').textContent = cur.chain + ' · ' + m.n;
  const prev = latest[m.i + '|' + cur.chain];
  if (lockedUntil(prev)) { toast('הסניף בוקר ב-' + fmt(prev.t) + '. ביקור נוסף אפשרי מ-' + fmt(lockedUntil(prev))); return; }
  $('vwarn').hidden = !prev;
  if (prev) $('vwarn').textContent = 'הביקור הקודם בסניף היה ב-' + fmt(prev.t) + ', על ידי ' + prev.by + ' (' + prev.s + ').';
  $('dlg').showModal();
}
function render() {
  const m = byId[location.hash.slice(1)];
  if (m) mallView(m); else home();
}
app.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) { city = chip.dataset.city; limit = 30; home(); return; }
  if (e.target.id === 'more') { limit += 30; home(); return; }
  const vb = e.target.closest('[data-visit]'), mm = byId[location.hash.slice(1)];
  if (vb && mm) openVisit(mm, +vb.dataset.visit);
  const cb = e.target.closest('[data-claim]');
  if (cb && mm) sendClaim(mm, cb.dataset.claim, cb);
});
app.addEventListener('error', e => {  // לוגו שלא נטען מוחלף בשם הרשת
  const im = e.target;
  if (im.tagName === 'IMG' && im.dataset.n) { const p = im.parentElement; p.classList.add('txt'); p.textContent = im.dataset.n; }
}, true);
q.addEventListener('input', () => { limit = 30; if (byId[location.hash.slice(1)]) location.hash = ''; else home(); });
window.addEventListener('hashchange', () => { render(); loadVisits(); });
render();
initRep();
</script>
